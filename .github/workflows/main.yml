name: 전자정부프레임워크를 사용하여 빌드 및 배포

on:
  push:
    branches:
      - main       # 주석 : main 브랜치에 push가 되면 actions가 동작함

jobs:
  build:
    runs-on: ubuntu-latest   # 어떤 운영체제 버전에서 실행하는지 설정

    steps:
    - name: 소스 check out
      uses: actions/checkout@v3

    - name: 메이븐 빌드
      run: mvn clean package
