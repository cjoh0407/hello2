name: docker 이미지 빌드 및 배포

on:
  push:
    branches:
      - empty       # 주석 : main 브랜치에 push가 되면 actions가 동작함

#환경변수
env:
  SERVER_IP: 3.38.152.247
  
jobs:
  build:
    runs-on: ubuntu-latest   # 어떤 운영체제 버전에서 실행하는지 설정

    steps:
    - name: 소스 check out
      uses: actions/checkout@v3

    - name: 메이븐 빌드
      run: mvn clean package

# 직접 무식하게 해본 것
    - name: 보안환경변수를 이용하여 개인키 파일생성
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        # 제공되는 라이브러리를 이용하여 해본 것
    - name: actions을 사용하여 보안환경변수를 이용하여 개인키 파일생성
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}        
        
    - name: 서버연결 시 지문등록
      run: ssh-keyscan -t ed25519 ${{ env.SERVER_IP }}  >> ~/.ssh/known_hosts
      
    - name: Docker 로그인
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: docker 이미지 빌드
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/hello:latest .

    - name: docker hub 이미지 저장
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/hello:latest
        
        
#    - name: 개인키파일확인
#      run: |
#        cat ~/.ssh/id_rsa
#        cat ~/.ssh/known_hosts
  
#  deploy:
#    needs: build
#    name: 운영서버에 배포 진행
#    runs-on: ubuntu-ratest
#    steps:
     
    - name: 배포 실행
      run: |
        ssh -i ~/.ssh/id_rsa ubuntu@${{ env.SERVER_IP }} << 'EOF'
            #docker 로그인
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
        
            #docker 관련 실행명령어 기록
            docker stop hello_app
            docker rm hello_app
            docker rmi -t ${{ secrets.DOCKER_USERNAME }}/hello:latest
            docker run -dit --name hello_app -p 80:8080 ${{ secrets.DOCKER_USERNAME }}/hello:latest
        EOF
        