name: runners를 사용하여 빌드 및 배포

on:
  push:
    branches:
      - main       # 주석 : main 브랜치에 push가 되면 actions가 동작함

jobs:
  build:
    runs-on: [self-hosted, kosa-label]   # 어떤 운영체제 버전에서 실행하는지 설정
    
    steps:
    - name: 소스 check out
      uses: actions/checkout@v3

    - name: 메이븐 빌드
      run: mvn clean package
      
    - name: Docker 로그인
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: docker 이미지 빌드
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/hello:latest .

    - name: docker hub 이미지 저장
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/hello:latest
        
    - name: 배포 실행
      run: |
        #docker 관련 실행명령어 기록
        docker stop hello_app
        docker rm hello_app
        docker rmi -t ${{ secrets.DOCKER_USERNAME }}/hello:latest
        docker run -dit --name hello_app -p 80:8080 ${{ secrets.DOCKER_USERNAME }}/hello:latest
            